<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄语四六级·荣耀殿堂</title>
    <!-- 引入 Supabase 和 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        :root { --gold: #eacda3; --gold-dark: #d6ae7b; --bg: #0f1115; --panel: rgba(26, 29, 36, 0.7); }
        body { font-family: 'Helvetica Neue', -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #e2e8f0; }
        
        .container { width: 100%; max-width: 450px; perspective: 1000px; }
        .card { background: var(--panel); padding: 30px 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.6); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        
        h2 { text-align: center; color: var(--gold); margin-top: 0; font-size: 20px; font-weight: 500; letter-spacing: 2px; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; font-size: 13px; font-weight: 300; letter-spacing: 1px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: rgba(0,0,0,0.3); color: #fff; box-sizing: border-box; font-size: 15px; transition: all 0.3s ease; }
        input:focus, select:focus { border-color: var(--gold-dark); outline: none; box-shadow: 0 0 0 1px var(--gold-dark); background: rgba(0,0,0,0.5); }
        
        .radio-group { display: flex; gap: 20px; }
        .radio-group label { display: flex; align-items: center; gap: 6px; color: #cbd5e1; font-size: 14px; font-weight: 300; }
        
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #1e1e1e; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; letter-spacing: 1px; cursor: pointer; transition: transform 0.2s, opacity 0.2s; }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }
        
        /* 战报卡片专属样式 */
        #resultCard { display: none; animation: scaleUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        .score-display { font-size: 56px; font-weight: 300; text-align: center; color: var(--gold); margin: 15px 0; font-family: -apple-system, sans-serif; }
        
        .stats-grid { display: flex; justify-content: space-between; text-align: center; margin: 25px 0 15px; padding: 15px 0; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stats-grid .val { color: var(--gold); font-size: 20px; font-weight: 500; margin-bottom: 4px; }
        .stats-grid .label { color: #64748b; font-size: 11px; letter-spacing: 1px; }
        
        #mobileChart { width: 100%; height: 180px; margin-top: 10px; }
        
        /* 循环滚动跑马灯样式 */
        .marquee-title { color: #94a3b8; font-size: 12px; margin: 15px 0 10px; letter-spacing: 1px; text-align: center; }
        .scroll-container { height: 130px; overflow: hidden; position: relative; /* 边缘羽化渐隐特效 */ -webkit-mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent); }
        .scroll-wrapper { display: flex; flex-direction: column; gap: 8px; animation: scrollUp 15s linear infinite; }
        /* 鼠标悬停/手指按住时暂停滚动 */
        .scroll-container:hover .scroll-wrapper, .scroll-container:active .scroll-wrapper { animation-play-state: paused; }
        
        .latest-item { padding: 12px 15px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; justify-content: space-between; align-items: center; border-left: 2px solid rgba(234, 205, 163, 0.3); font-size: 14px; font-weight: 300; }
        .latest-item .score-tag { color: var(--gold); font-weight: 500; font-size: 16px; }
        
        @keyframes scaleUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes scrollUp { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- 表单区 -->
        <div class="card" id="formCard">
            <h2>成绩荣誉录入</h2>
            <form id="scoreForm">
                <div class="form-group"><label>学员姓名</label><input type="text" id="name" required placeholder="请输入你的姓名"></div>
                <div class="form-group"><label>考试级别</label>
                    <div class="radio-group">
                        <label><input type="radio" name="level" value="俄语四级" checked> 俄语四级</label>
                        <label><input type="radio" name="level" value="俄语六级"> 俄语六级</label>
                    </div>
                </div>
                <div class="form-group"><label>最终成绩 (支持小数)</label><input type="number" id="score" required min="0" max="100" step="0.1" placeholder="例如: 85.5"></div>
                <div class="form-group"><label>所在班型</label>
                    <select id="className">
                        <option value="全程班">全程班</option><option value="直通班">直通班</option>
                        <option value="练题班">练题班</option><option value="真题班">真题班</option>
                        <option value="听力训练营">听力训练营</option><option value="自学">自学</option>
                    </select>
                </div>
                <div class="form-group"><label>考后感言</label><input type="text" id="comment" placeholder="考得怎么样？有什么想说的？"></div>
                <button type="submit" class="btn-submit" id="submitBtn">载入荣誉殿堂</button>
            </form>
        </div>

        <!-- 战报区 -->
        <div class="card" id="resultCard">
            <h2 style="font-size: 16px; color: #e2e8f0;">数据同步成功</h2>
            <div class="score-display" id="resScore">0</div>
            
            <div class="stats-grid">
                <div><div class="val" id="resTotal">0</div><div class="label">全网同级人数</div></div>
                <div><div class="val" id="resPassRate">0%</div><div class="label">全网及格率</div></div>
                <div><div class="val" id="resAvg">0</div><div class="label">全网平均分</div></div>
            </div>

            <!-- 图表容器 -->
            <div id="mobileChart"></div>
            
            <!-- 循环滚动跑马灯容器 -->
            <div class="marquee-title">✦ 实时荣誉滚动 ✦</div>
            <div class="scroll-container">
                <div class="scroll-wrapper" id="scrollWrapper">
                    <!-- 数据将由 JS 自动填充 -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 请填入你的真实 Supabase 密钥！
        // ==========================================
        const supabaseUrl = 'https://jqkacisuyoebxuaugmdh.supabase.co'; 
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impxa2FjaXN1eW9lYnh1YXVnbWRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0OTYyOTcsImV4cCI6MjEwMzA3MjI5N30.un4kBkbo0XLt-axHLOxxWROeL8wSsyW_487hxJme3CU'; 
        const dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('scoreForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = '正在加密上传...'; btn.disabled = true;

            const name = document.getElementById('name').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const score = parseFloat(document.getElementById('score').value);
            const class_name = document.getElementById('className').value;
            const comment = document.getElementById('comment').value || '';

            // 1. 上传数据
            const { error: insertError } = await dbClient.from('scores').insert([{ name, level, score, class_name, comment }]);
            
            if (!insertError) {
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('resultCard').style.display = 'block';
                document.getElementById('resScore').innerText = score;

                // 2. 拉取全网该级别最新的 20 条数据，用于滚动播报
                const { data: levelData } = await dbClient.from('scores').select('*').eq('level', level).order('id', { ascending: false }).limit(20);
                
                if (levelData && levelData.length > 0) {
                    let sum = 0, passCount = 0, dist = [0,0,0,0,0];
                    
                    // 这里为了统计准确，可以再单独查一次总数，但为了速度，暂用拉取的数据做分布展示
                    levelData.forEach(item => {
                        sum += item.score;
                        if (item.score >= 60) passCount++;
                        if(item.score < 60) dist[0]++; else if(item.score < 70) dist[1]++; else if(item.score < 80) dist[2]++; else if(item.score < 90) dist[3]++; else dist[4]++;
                    });
                    
                    document.getElementById('resTotal').innerText = levelData.length;
                    document.getElementById('resAvg').innerText = (sum / levelData.length).toFixed(1);
                    document.getElementById('resPassRate').innerText = ((passCount / levelData.length) * 100).toFixed(1) + '%';
                    
                    // 渲染高级圆角渐变图表
                    const mChart = echarts.init(document.getElementById('mobileChart'));
                    mChart.setOption({
                        grid: { left: '3%', right: '3%', top: '15%', bottom: '5%', containLabel: true },
                        xAxis: { type: 'category', data: ['<60', '60-69', '70-79', '80-89', '90+'], axisLine: { show: false }, axisTick: { show: false }, axisLabel: { color: '#64748b', fontSize: 10 } },
                        yAxis: { type: 'value', splitLine: { show: false }, axisLabel: { show: false } },
                        series: [{ 
                            type: 'bar', 
                            barWidth: '40%', 
                            itemStyle: { 
                                borderRadius: [4, 4, 0, 0], // 顶部圆角
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{offset: 0, color: '#eacda3'}, {offset: 1, color: '#8e795a'}]) 
                            }, 
                            label: { show: true, position: 'top', color: '#eacda3', fontSize: 10 }, 
                            data: dist 
                        }]
                    });

                    // 渲染无缝循环跑马灯
                    const wrapper = document.getElementById('scrollWrapper');
                    let htmlContent = '';
                    levelData.forEach(record => {
                        htmlContent += `
                            <div class="latest-item">
                                <span>${record.name} <span style="font-size:11px;color:#64748b;margin-left:5px;">${record.class_name}</span></span>
                                <span class="score-tag">${record.score}</span>
                            </div>`;
                    });
                    
                    // 【核心逻辑】：将数据复制一倍拼接在一起，由于 CSS 设置了 translateY(-50%)，当滚到一半时会瞬间切回开头，实现视觉上的无缝循环。
                    wrapper.innerHTML = htmlContent + htmlContent; 
                }
            } else {
                alert('上传失败：' + insertError.message); 
                btn.innerText = '载入荣誉殿堂'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
