
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>俄语四六级成绩录入</title>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, sans-serif; background: linear-gradient(135deg, #f6f8fd 0%, #e9f0f9 100%); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: white; padding: 30px 25px; border-radius: 20px; box-shadow: 0 15px 35px rgba(50,50,93,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #1a237e; margin-top: 0; font-size: 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #3c4858; font-weight: 600; font-size: 15px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        .radio-group { display: flex; gap: 20px; }
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(to right, #4facfe, #00f2fe); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .success-msg { display: none; text-align: center; color: #10b981; margin-top: 20px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>🎉 成绩捷报墙录入</h2>
        <form id="scoreForm">
            <div class="form-group"><label>姓名</label><input type="text" id="name" required></div>
            <div class="form-group">
                <label>报考等级</label>
                <div class="radio-group">
                    <label><input type="radio" name="level" value="俄语四级" checked> 俄语四级</label>
                    <label><input type="radio" name="level" value="俄语六级"> 俄语六级</label>
                </div>
            </div>
            <div class="form-group"><label>考试总分</label><input type="number" id="score" required min="0" max="100"></div>
            <div class="form-group"><label>班型</label><select id="className"><option>冲刺集训营</option><option>全程班</option><option>自学</option></select></div>
            <div class="form-group"><label>考后感言</label><input type="text" id="comment"></div>
            <button type="submit" class="btn-submit" id="submitBtn">发送捷报上大屏</button>
            <div class="success-msg" id="successMsg">✨ 发送成功！快看大屏！</div>
        </form>
    </div>

    <script>
        // ==========================================
        // 请在这里填入你的 Supabase URL 和 Key
        // ==========================================
        const supabaseUrl = 'https://jqkacisuyoebxuaugmdh.supabase.co/rest/v1/';
        const supabaseKey = 'sb_publishable_-TWJDAWr_uRHSyoP7p6pCw_4tTNsi7J';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('scoreForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = '正在发送...'; btn.disabled = true;

            const name = document.getElementById('name').value;
            const level = document.querySelector('input[name="level"]:checked').value;
            const score = parseInt(document.getElementById('score').value);
            const class_name = document.getElementById('className').value;
            const comment = document.getElementById('comment').value;

            // 直接将数据推送到 Supabase 云端
            const { error } = await supabase.from('scores').insert([{ name, level, score, class_name, comment }]);
            
            if (!error) {
                document.getElementById('successMsg').style.display = 'block';
                setTimeout(() => { document.getElementById('scoreForm').reset(); btn.innerText = '发送捷报上大屏'; btn.disabled = false; document.getElementById('successMsg').style.display = 'none'; }, 3000);
            } else {
                alert('发送失败，请重试！'); btn.innerText = '发送捷报上大屏'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
